    <style>
      /* Pantalla de carga de bienvenida. Se quita desde src/main.jsx. */
      #carga {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f4ede2;
        transition: opacity 600ms ease, visibility 600ms ease;
      }
      #carga.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #carga figure {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      #carga img {
        width: 120px;
        height: auto;
        animation: carga-respira 1.8s ease-in-out infinite;
      }
      #carga figcaption {
        color: #5c1220;
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        font-size: 2rem;
        font-style: italic;
        letter-spacing: 0.02em;
        animation: carga-aparece 900ms ease 200ms both;
      }
      #carga span {
        width: 56px;
        height: 2px;
        overflow: hidden;
        background: rgba(148, 97, 79, 0.2);
        border-radius: 2px;
      }
      #carga span::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #94614f;
        animation: carga-barra 1.2s ease-in-out infinite;
      }
      @keyframes carga-respira {
        0%, 100% { opacity: 0.75; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes carga-aparece {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes carga-barra {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #carga img, #carga figcaption, #carga span::after { animation: none; }
      }
    </style>
  </head>
